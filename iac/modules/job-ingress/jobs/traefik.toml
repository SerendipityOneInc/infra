[accessLog]

[api]
  dashboard = true
  insecure = false

[entryPoints]
  [entryPoints.traefik]
    address = ":${control_port}"

  [entryPoints.web]
    address = ":${ingress_port}"
    asDefault = true

    [entryPoints.web.transport.lifecycle]
      # Keep accepting requests (and /ping) until LB detects health failure and stops routing
      # /ping returns 503 while in graceful shutdown
      requestAcceptGraceTimeout = "30s"
      # After the grace window, give active connections up to 24h to finish before forcefully closing them
      graceTimeOut = "24h"

  [entryPoints.internal]
    address = ":${ingress_internal_port}"
    asDefault = false

    [entryPoints.internal.transport.lifecycle]
      # Keep accepting requests (and /ping) until LB detects health failure and stops routing
      # /ping returns 503 while in graceful shutdown
      requestAcceptGraceTimeout = "30s"
      # After the grace window, give active connections up to 24h to finish before forcefully closing them
      graceTimeOut = "24h"
%{ if tls_enabled ~}

  # TLS-terminating entrypoint for the sandbox data plane behind an L4
  # passthrough LB. HTTP/2 is negotiated via ALPN and carried h2c to the
  # backend, so bidirectional streams (PTY) work end to end.
  [entryPoints.websecure]
    address = ":${ingress_secure_port}"
    asDefault = false

    [entryPoints.websecure.http.tls]
      certResolver = "le"
%{ for d in acme_domains ~}
      [[entryPoints.websecure.http.tls.domains]]
        main = "${d.main}"
        sans = [${join(", ", [for s in d.sans : "\"${s}\""])}]
%{ endfor ~}

    [entryPoints.websecure.transport.lifecycle]
      requestAcceptGraceTimeout = "30s"
      graceTimeOut = "24h"

[certificatesResolvers.le.acme]
  email = "${acme_email}"
  storage = "/acme/acme.json"
  [certificatesResolvers.le.acme.dnsChallenge]
    provider = "cloudflare"
    resolvers = ["1.1.1.1:53", "8.8.8.8:53"]
%{ endif ~}

[metrics]
  [metrics.otlp]
    [metrics.otlp.grpc]
      endpoint = "${otel_collector_grpc_endpoint}"
      insecure = true

[ping]
  entryPoint = "web"

[providers]
  [providers.consulCatalog]
    exposedByDefault = false
    [providers.consulCatalog.endpoint]
      address = "${consul_endpoint}"
      token = "${consul_token}"
  [providers.file]
    directory = "/local/config"
    watch = false
  [providers.nomad]
    exposedByDefault = false
    [providers.nomad.endpoint]
      address = "${nomad_endpoint}"
      token = "${nomad_token}"

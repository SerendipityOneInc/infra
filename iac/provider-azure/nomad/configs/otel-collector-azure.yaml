# Azure override for job-otel-collector (passed via otel_collector_config_override).
# The shared default config hard-wires Grafana Cloud exporters into every
# pipeline; this deployment has no Grafana Cloud account, so only the
# in-cluster leg is kept: e2b.* metrics -> ClickHouse (read back by the API's
# sandbox-metrics endpoints). Traces/logs pipelines terminate in the debug
# exporter so services' OTLP exports succeed quietly instead of spamming
# connection-refused; Loki ingestion is handled by logs-collector (vector),
# not this collector.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 100
        read_buffer_size: 10943040
        max_concurrent_streams: 200
        write_buffer_size: 10943040

  # This job is a nomad system job — each node's collector scrapes its own
  # nomad agent, so client metrics cover every node.
  prometheus:
    config:
      scrape_configs:
        - job_name: nomad
          scrape_interval: 15s
          scrape_timeout: 5s
          metrics_path: "/v1/metrics"
          static_configs:
            - targets: ["localhost:4646"]
          params:
            format: ["prometheus"]

processors:
  batch: {}

  batch/clickhouse:
    timeout: 5s
    send_batch_size: 50000

  filter/external_metrics:
    metrics:
      include:
        match_type: regexp
        metric_names:
          - "e2b.*"

  # Node/alloc resource history for Grafana (upstream sends these to Grafana
  # Cloud instead). Gauge-only whitelist (the same set upstream's otel-agent
  # keeps): nomad also emits summary-type timer metrics under nomad_client_*,
  # and one summary in a batch fails the whole ClickHouse insert (no
  # otel_metrics_summary table), dropping the gauges with it.
  filter/nomad_metrics:
    metrics:
      include:
        match_type: strict
        metric_names:
          - "nomad_client_host_cpu_idle"
          - "nomad_client_host_disk_available"
          - "nomad_client_host_disk_size"
          - "nomad_client_allocs_memory_usage"
          - "nomad_client_allocs_cpu_usage"
          - "nomad_client_host_memory_available"
          - "nomad_client_host_memory_total"

  # Process/cgroup gauges emitted only when the build-cache memory watermark is
  # enabled. Keep them in the REAL infra tables so Grafana alerting can query
  # them; the product metrics tables intentionally discard rows without team or
  # sandbox dimensions.
  filter/infra_application_metrics:
    metrics:
      include:
        match_type: regexp
        metric_names:
          - "e2b\\.infra\\..*"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  debug:
    verbosity: basic
    sampling_initial: 1
    sampling_thereafter: 5000

  clickhouse:
    endpoint: tcp://${clickhouse_host}:${clickhouse_port}
    database: ${clickhouse_database}
    username: ${clickhouse_username}
    password: ${clickhouse_password}
    async_insert: true
    create_schema: false
    metrics_tables:
      gauge:
        name: "metrics_gauge"
      sum:
        name: "metrics_sum"

  # Infra (nomad) metrics need REAL tables: the e2b metrics_gauge/metrics_sum
  # are Null-engine tables that only feed the sandbox_/team_ materialized
  # views (rows without sandbox_id/team_id are discarded by design). This
  # exporter owns its own otel_metrics_* tables (create_schema).
  clickhouse/infra:
    endpoint: tcp://${clickhouse_host}:${clickhouse_port}
    database: ${clickhouse_database}
    username: ${clickhouse_username}
    password: ${clickhouse_password}
    async_insert: true
    create_schema: true
    ttl: 168h

service:
  telemetry:
    logs:
      level: warn
  extensions:
    - health_check
  pipelines:
    metrics/external:
      receivers:
        - otlp
      processors:
        - filter/external_metrics
        - batch/clickhouse
      exporters:
        - clickhouse
    metrics/nomad:
      receivers:
        - prometheus
      processors:
        - filter/nomad_metrics
        - batch/clickhouse
      exporters:
        - clickhouse/infra
    metrics/infra_application:
      receivers:
        - otlp
      processors:
        - filter/infra_application_metrics
        - batch/clickhouse
      exporters:
        - clickhouse/infra
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
